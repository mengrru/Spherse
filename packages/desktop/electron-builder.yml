appId: com.spherse.app
productName: Spherse
# 三平台统一可执行文件名。必须与 productName 一致（Spherse）：顶层 executableName 会
# 覆盖所有平台的 productFilename（app-builder-lib AppInfo），改成别的值会连带改变
# mac 的 .app bundle 名与 win 的 exe 名，打断 packaged-smoke 与已装机用户的覆盖升级；
# Linux 默认取 scoped 包名（@spherse/desktop → @ 开头的非法二进制名），故需显式声明。
executableName: Spherse
directories:
  buildResources: build
  output: release
publish:
  provider: github
  owner: mengrru
  repo: Spherse
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../presets/sample-projects
    to: sample-projects
    filter: ["**/*"]
npmRebuild: false
extraMetadata:
  main: dist/main/index.js
mac:
  category: public.app-category.productivity
  icon: build/spherse-icon.icns
  target:
    - dmg
win:
  icon: build/spherse-icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  # 注意：不要在这里声明 arch 列表。config 里的 target.arch 会覆盖 CI 的 --x64/--arm64
  # CLI flag（app-builder-lib computeArchToTargetNamesMap），导致每个 matrix job 都打出
  # 双 arch + 一个无后缀的合并安装包，且各 job 产物同名并发上传互相 clobber 而 404。
  # arch 由 build-and-release.yml 的 matrix（--win --x64 / --win --arm64）控制。
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/spherse-icon.png
  category: Utility
  maintainer: Spherse <noreply@spherse.app>
  vendor: Spherse
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
