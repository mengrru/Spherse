appId: com.spherse.app
productName: Spherse
directories:
  buildResources: build
  output: release
publish:
  provider: github
  owner: mengrru
  repo: Spherse
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../presets/sample-projects
    to: sample-projects
    filter: ["**/*"]
npmRebuild: false
extraMetadata:
  main: dist/main/index.js
mac:
  category: public.app-category.productivity
  icon: build/spherse-icon.icns
  target:
    - dmg
win:
  icon: build/spherse-icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
