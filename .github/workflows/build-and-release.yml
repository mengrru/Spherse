name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-publish to OSS (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 发版门禁：lint + build + typecheck + 全 workspace 单测 + i18n check。
  # 失败则 create-release/build 均不启动（不产生空 draft release，避免阻塞同 tag 重打）。
  # workflow_dispatch 重发布跳过：原 tag push 时已通过验证，无需重复拖慢重发布。
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19

      - name: Install dependencies (skip native compilation)
        run: npm ci --ignore-scripts

      - name: Download Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      - name: Verify (lint + build + typecheck + unit tests + i18n)
        run: npm run verify

  create-release:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

  build:
    needs: create-release
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build-args: --mac
            artifact: dmg
            arch-label: arm64
            target-arch: arm64
          - os: macos-latest
            build-args: --mac --x64
            artifact: dmg
            arch-label: intel
            target-arch: x64
          - os: windows-latest
            build-args: --win --x64
            artifact: exe
            arch-label: ""
            target-arch: x64
          - os: windows-latest
            build-args: --win --arm64
            artifact: exe
            arch-label: ""
            target-arch: arm64
          - os: ubuntu-latest
            build-args: --linux --x64
            artifact: linux
            arch-label: ""
            target-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19

      - name: Install dependencies (skip native compilation)
        run: npm ci --ignore-scripts

      - name: Sync app version from tag
        shell: bash
        working-directory: packages/desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build desktop chain (i18n -> presets -> sdk -> core -> server -> desktop)
        run: npm run build:desktop

      - name: Download Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      - name: Rebuild native deps for Electron (better-sqlite3)
        env:
          BUILD_TARGET_ARCH: ${{ matrix.target-arch }}
        run: node scripts/rebuild-native.mjs

      - name: Build installer (electron-builder)
        working-directory: packages/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -z "${CSC_LINK:-}${CSC_NAME:-}" ]]; then
            unset CSC_LINK CSC_NAME CSC_KEY_PASSWORD
            npx electron-builder ${{ matrix.build-args }} --config.mac.identity=- --config.mac.hardenedRuntime=false --publish never
          else
            npx electron-builder ${{ matrix.build-args }} --publish never
          fi

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test packaged app
        # 只在 runner 架构与目标架构一致的 matrix job 上执行（mac arm64 / win x64 / linux x64）：
        # mac intel 交叉构建需 Rosetta、win arm64 无法在 x64 runner 上运行，均跳过
        if: >-
          (runner.os == 'macOS' && matrix.target-arch == 'arm64') ||
          (runner.os == 'Windows' && matrix.target-arch == 'x64') ||
          (runner.os == 'Linux' && matrix.target-arch == 'x64')
        working-directory: packages/desktop
        shell: bash
        env:
          SPHERSE_SMOKE: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bash -c 'SPHERSE_SMOKE_VERSION="${GITHUB_REF_NAME#v}" npx playwright test -c playwright.config.ts e2e/packaged-smoke.spec.ts'
          else
            SPHERSE_SMOKE_VERSION="${GITHUB_REF_NAME#v}" npx playwright test -c playwright.config.ts e2e/packaged-smoke.spec.ts
          fi

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv release/*.dmg "release/Spherse-${GITHUB_REF_NAME#v}-${{ matrix.arch-label }}.dmg"
          gh release upload "${GITHUB_REF_NAME}" release/*.dmg --clobber

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只上传本 job arch 后缀的安装包：x64/arm64 两个 matrix job 并发运行，
        # 若按 release/*.exe 全量上传，双 arch 时产物同名会并发 --clobber 互踩（曾致 HTTP 404）
        run: gh release upload "${GITHUB_REF_NAME}" "release/*-${{ matrix.target-arch }}.exe" --clobber

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release/*.AppImage release/*.deb --clobber

  publish-oss:
    needs: build
    if: >-
      always() &&
      (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve version
        id: ver
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install ossutil
        run: |
          curl -fsSL -o /tmp/ossutil https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x /tmp/ossutil

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./oss-out
          gh release download "${RELEASE_TAG}" -D ./oss-out \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.AppImage' --clobber

      - name: Discover asset filenames
        id: assets
        run: |
          arm64_dmg=$(basename "$(ls ./oss-out/*arm64*.dmg | head -n1)")
          intel_dmg=$(basename "$(ls ./oss-out/*intel*.dmg | head -n1)")
          win_exe=$(basename "$(ls ./oss-out/*.exe | grep -v 'arm64' | head -n1)")
          win_arm64_exe=$(basename "$(ls ./oss-out/*arm64*.exe 2>/dev/null | head -n1)" 2>/dev/null || true)
          linux_appimage=$(basename "$(ls ./oss-out/*.AppImage 2>/dev/null | head -n1)" 2>/dev/null || true)
          if [[ -z "$arm64_dmg" || -z "$intel_dmg" ]]; then
            echo "::error::Required macOS dmg assets not found in release (arm64/intel)"
            exit 1
          fi
          if [[ -z "$win_exe" ]]; then
            echo "::error::Required x64 Windows installer not found in release assets"
            exit 1
          fi
          # linux_appimage 与 win_arm64_exe 同为可选：workflow_dispatch 重发旧 tag 时，
          # pre-Linux 时代的 release 没有 AppImage，缺失时省略 latest.json 的 linux 键
          # 而非硬失败（读取端对缺失键有回退）。
          {
            echo "arm64_dmg=${arm64_dmg}"
            echo "intel_dmg=${intel_dmg}"
            echo "win_exe=${win_exe}"
            echo "win_arm64_exe=${win_arm64_exe}"
            echo "linux_appimage=${linux_appimage}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload installers to OSS (versioned path)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          for f in ./oss-out/*; do
            /tmp/ossutil cp "$f" "oss://${OSS_BUCKET}/spherse/releases/${VER}/$(basename "$f")" \
              -e "$OSS_ENDPOINT" \
              -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
              --force -u
          done

      - name: Generate and upload latest.json
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          BASE="${OSS_PUBLIC_BASE_URL}/spherse/releases/${VER}"
          WIN_ARM64_NAME="${{ steps.assets.outputs.win_arm64_exe }}"
          LINUX_APPIMAGE_NAME="${{ steps.assets.outputs.linux_appimage }}"
          # 基础清单只含必需键，可选键（win.arm64 / linux.x64）按存在与否增量合并，
          # 避免 arm64 × linux 的组合分支膨胀
          jq -n \
            --arg version "$VER" \
            --arg arm64 "${BASE}/${{ steps.assets.outputs.arm64_dmg }}" \
            --arg intel "${BASE}/${{ steps.assets.outputs.intel_dmg }}" \
            --arg x64 "${BASE}/${{ steps.assets.outputs.win_exe }}" \
            '{version:$version, mac:{arm64:$arm64, intel:$intel}, win:{x64:$x64}}' \
            > /tmp/latest.json
          if [[ -n "$WIN_ARM64_NAME" ]]; then
            jq --arg url "${BASE}/${WIN_ARM64_NAME}" '.win.arm64 = $url' \
              /tmp/latest.json > /tmp/latest.json.tmp && mv /tmp/latest.json.tmp /tmp/latest.json
          fi
          if [[ -n "$LINUX_APPIMAGE_NAME" ]]; then
            jq --arg url "${BASE}/${LINUX_APPIMAGE_NAME}" '.linux = {x64:$url}' \
              /tmp/latest.json > /tmp/latest.json.tmp && mv /tmp/latest.json.tmp /tmp/latest.json
          fi
          jq empty /tmp/latest.json
          /tmp/ossutil cp /tmp/latest.json "oss://${OSS_BUCKET}/spherse/latest.json" \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --force -u

  # 全量重建 changelog：拉取全部 GitHub release notes，筛掉 docs/chore/infra 条目并
  # 结构化后上传 OSS spherse/changelog.json。串行在 publish-oss 之后而非与 build 并行：
  # latest.json 更新完成后才写入新版本 changelog，避免发版期间（或 build 失败后）
  # changelog 首条与 latest.json 版本不一致。
  # workflow_dispatch 重发布时 publish-oss 也会执行，本 job 随之运行（全量重建幂等，
  # 可用于修复/刷新历史 changelog）。
  publish-changelog:
    needs: publish-oss
    if: always() && needs.publish-oss.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-changelog.mjs --repo "${GITHUB_REPOSITORY}" --output /tmp/changelog.json

      - name: Install ossutil
        run: |
          curl -fsSL -o /tmp/ossutil https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x /tmp/ossutil

      - name: Upload changelog to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          /tmp/ossutil cp /tmp/changelog.json "oss://${OSS_BUCKET}/spherse/changelog.json" \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --force -u

  # 发版完成后联动部署 web 版（GitHub Pages：landing + web）。
  # GITHUB_TOKEN 触发的事件默认不会级联 workflow run，但 workflow_dispatch 是官方例外，
  # 因此用 gh workflow run（需要 actions: write 权限）触发 deploy-pages.yml；
  # ref 用发版 tag，保证 Pages 内容与本次发版代码一致。
  deploy-web:
    needs: [publish-oss, publish-changelog]
    if: >-
      github.event_name == 'push' &&
      needs.publish-oss.result == 'success' &&
      needs.publish-changelog.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Pages deploy (landing + web)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f include_web=true
