name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/landing/**"
      - "packages/i18n/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      include_web:
        description: "Also build and deploy the web app (used by release pipeline)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: ${{ github.event_name == 'workflow_dispatch' && inputs.include_web }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19

      - run: npm ci

      - name: Sync web version from tag
        if: github.event_name == 'workflow_dispatch' && inputs.include_web
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --workspace=packages/web
          else
            echo "Not on a tag ref; keeping packages/web package.json version"
          fi

      - name: Build landing
        env:
          VITE_OSS_MANIFEST_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}/spherse/latest.json
          VITE_OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
        run: npm run build:landing

      - name: Build web app
        if: github.event_name == 'workflow_dispatch' && inputs.include_web
        run: npm run build:web

      # main push 只部署 landing（增量，保留已部署的 /web——web 仅随发版部署，
      # 由 build-and-release.yml 的 deploy-web job 以发版 tag 触发本 workflow）
      - name: Stage Pages content
        run: |
          set -e
          mkdir -p ./pages-out
          cp -r packages/landing/dist/. ./pages-out/
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.include_web }}" = "true" ]; then
            mkdir -p ./pages-out/web
            cp -r packages/web/dist/. ./pages-out/web/
            cp packages/web/pages-assets/404.html ./pages-out/404.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-out
          keep_files: ${{ github.event_name != 'workflow_dispatch' || !inputs.include_web }}
