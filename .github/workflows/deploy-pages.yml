name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/landing/**"
      - "packages/web/**"
      - "packages/i18n/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Sync web version from latest tag
        shell: bash
        run: |
          LATEST_TAG=$(git describe --abbrev=0 --tags --match 'v*' 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            npm version "${LATEST_TAG#v}" --no-git-tag-version --allow-same-version --workspace=packages/web
          else
            echo "No tag found; keeping packages/web package.json version"
          fi

      - name: Build landing
        env:
          VITE_OSS_MANIFEST_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}/spherse/latest.json
          VITE_OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
        run: npm run build:landing

      - name: Build web app
        run: npm run build:web

      - name: Stage Pages content
        run: |
          set -e
          mkdir -p ./pages-out
          cp -r packages/landing/dist/. ./pages-out/
          mkdir -p ./pages-out/web
          cp -r packages/web/dist/. ./pages-out/web/
          cp packages/web/pages-assets/404.html ./pages-out/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-out
          keep_files: false
